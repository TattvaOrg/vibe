<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle matte gradient -->
    <radialGradient id="matteBg" cx="50%" cy="50%" r="55%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Outer rim glow reflection -->
    <linearGradient id="edgeGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#a1a1aa" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#52525b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Inner ambient pulse wave -->
    <linearGradient id="innerBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.1" />
    </linearGradient>

    <!-- Blur filter for soft ambient diffusion -->
    <filter id="ambientBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Matte black rounded app squircle container -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#matteBg)" stroke="#27272a" stroke-width="2" />

  <!-- Outer curved ambient rim ring (representing the display edge glow) -->
  <rect x="72" y="72" width="368" height="368" rx="88" ry="88" fill="none" stroke="url(#edgeGlowGrad)" stroke-width="8" stroke-linecap="round" filter="url(#ambientBlur)" />

  <!-- Secondary hairline concentric curve -->
  <rect x="96" y="96" width="320" height="320" rx="72" ry="72" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Central minimal wave / acoustic frequency apex curve -->
  <path d="M 176 256 C 208 256, 224 208, 256 208 C 288 208, 304 304, 336 304 C 352 304, 360 256, 384 256" 
        fill="none" 
        stroke="url(#innerBeam)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Minimalist corner accent notches representing screen bezels -->
  <circle cx="88" cy="88" r="4" fill="#ffffff" opacity="0.6" />
  <circle cx="424" cy="88" r="4" fill="#ffffff" opacity="0.6" />
  <circle cx="424" cy="424" r="4" fill="#ffffff" opacity="0.6" />
  <circle cx="88" cy="424" r="4" fill="#ffffff" opacity="0.6" />
</svg>
