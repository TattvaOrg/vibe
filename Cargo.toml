[workspace]
resolver = "3"
members = [
    "crates/vibe",
    "crates/vibe-core",
    "crates/vibe-audio",
    "crates/vibe-mpris",
    "crates/vibe-render",
    "crates/vibe-ui",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
